name: "Build"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - run: make go.mk
      shell: bash
    - uses: actions/setup-go@v7.0.0

    - run: make pre-check
      shell: bash

    - run: make build
      shell: bash

    - run: make test-verbose
      shell: bash
